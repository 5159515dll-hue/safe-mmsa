# SAFE-MMSA 对外反代：独立监听新端口 8080，完全不碰 AIoT 的 :80 站点。
# 浏览器访问 http://<服务器IP>:8080/ → Next.js(3100)；/api → FastAPI(8100)。
# 部署：放到 /etc/nginx/sites-available/safe-mmsa 并软链到 sites-enabled，nginx -t && reload。
# 注意：需在云安全组放行入站 8080 端口。

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # 允许上传视频/音频（与 API 的 50MB 上限匹配，留余量）。
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
